[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piplog"
version = "0.1.0"
description = "System-wide pip install audit logger with advisory scanning"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
piplog = "piplog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["piplog*"]